[package]
name = "tlsaudit"
version = "0.1.0"
edition = "2021"
description = "Deep TLS configuration audit of a live endpoint — protocol versions, weak ciphers, chain and hostname hygiene"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/tlsaudit"
readme = "README.md"
keywords = ["tls", "ssl", "security", "audit", "cipher"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "tlsaudit"
path = "src/lib.rs"

[[bin]]
name = "tlsaudit"
path = "src/main.rs"

[dependencies]
rustls = "0.23"
webpki-roots = "1"
x509-parser = "0.16"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
rcgen = "0.13"
time = "0.3"
